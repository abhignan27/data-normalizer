databaseChangeLog:
  - changeSet:
      id: 2
      author: solo-developer
      changes:
        # 1. Create the sequence generator in PostgreSQL
        - createSequence:
            sequenceName: HISTORIC_DATA_SEQ
            startValue: 1
            incrementBy: 1

        # 2. Create the historical data storage table
        - createTable:
            tableName: HISTORIC_DATA
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: EXCHANGE
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: SYMBOL
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: ASK_PRICE
                  type: NUMERIC(38,8)
              - column:
                  name: BID_PRICE
                  type: NUMERIC(38,8)
              - column:
                  name: LAST_PRICE
                  type: NUMERIC(38,8)
              - column:
                  name: ASK_QUANTITY
                  type: NUMERIC(38,8)
              - column:
                  name: BID_QUANTITY
                  type: NUMERIC(38,8)
              - column:
                  name: RECEIVED_TIMESTAMP
                  type: VARCHAR(100)
              - column:
                  name: RECORDED_TIMESTAMP
                  type: VARCHAR(100)
